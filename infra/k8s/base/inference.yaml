apiVersion: v1
kind: Service
metadata:
  name: inference
spec:
  type: ClusterIP
  selector:
    app: inference
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
        - name: inference
          image: ninar/inference:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: ninar-config }
            - secretRef: { name: ninar-env }
          env:
            - name: PORT
              value: "8000"
            - name: HF_MODEL_ID
              value: dontcryai/dontcry
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
