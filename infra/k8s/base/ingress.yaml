apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ninar
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ninar.example.com
        - api.ninar.example.com
      secretName: ninar-tls
  rules:
    - host: ninar.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 3000 }
    - host: api.ninar.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 3001 }
