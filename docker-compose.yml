services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ninar
      POSTGRES_USER: ninar
      POSTGRES_PASSWORD: ninar_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001_create_analyses.sql:/docker-entrypoint-initdb.d/001_create_analyses.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_local
    volumes:
      - umami_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: docker.umami.is/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    init: true
    environment:
      DATABASE_URL: postgresql://umami:umami_local@umami-db:5432/umami
      APP_SECRET: local-development-secret-change-in-production
      TWO_FACTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    ports:
      - "3002:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:1.5.21-compat
    user: "0:0"
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      S3_BUCKET: ninar-audio
      NINAR_WEB_ORIGIN: http://localhost:3000
    ports:
      - "4566:4566"
    volumes:
      - ./infra/floci/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - floci_data:/app/data

  inference:
    build:
      context: ./apps/inference
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL_ID: dontcryai/dontcry
      HF_MODEL_REVISION: ${HF_MODEL_REVISION:-158d507a8e19afeedb983f5ca25396453ac1c92b}
      HF_BASE_MODEL_REVISION: ${HF_BASE_MODEL_REVISION:-dba3bb02fda4248b6e082697eee756de8fe8aa8a}
      PORT: 8000
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: development
      PORT: 3001
      POSTGRES_URL: postgres://ninar:ninar_local@postgres:5432/ninar
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
      S3_ENDPOINT: http://floci:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      S3_BUCKET: ninar-audio
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3001:3001"
    depends_on:
      - floci
      - postgres
      - redis

  worker:
    build:
      context: ./apps/worker
    environment:
      NODE_ENV: development
      POSTGRES_URL: postgres://ninar:ninar_local@postgres:5432/ninar
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
      S3_ENDPOINT: http://floci:4566
      S3_BUCKET: ninar-audio
      SQS_QUEUE_URL: http://floci:4566/000000000000/analyses
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CLASSIFIER_URL: http://inference:8000
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: "1"
    depends_on:
      - floci
      - inference
      - postgres

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_UMAMI_HOST_URL: ${NEXT_PUBLIC_UMAMI_HOST_URL:-http://localhost:3002}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  umami_data:
  floci_data:
  hf_cache:
